name: Validate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: pip install pyyaml
      - name: Validate JSON/YAML-readable files
        run: python -c "import pathlib,yaml; yaml.safe_load(pathlib.Path('mains_alert/config.yaml').read_text()); yaml.safe_load(pathlib.Path('repository.yaml').read_text())"
