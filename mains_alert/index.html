<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mains Power Alert</title>
<style>
:root{color-scheme:light dark;--accent:#03a9f4;--card:#fff;--bg:#f3f5f7;--text:#202124;--muted:#687078;--bad:#d32f2f;--good:#2e7d32} @media(prefers-color-scheme:dark){:root{--card:#20242a;--bg:#111418;--text:#e9edf1;--muted:#aab2bb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;align-items:center}.card{background:var(--card);border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0002}h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;color:var(--muted);margin-bottom:5px}input,select,textarea,button{font:inherit;border:1px solid #8a929a;border-radius:7px;padding:9px;width:100%;background:var(--card);color:var(--text)}textarea{min-height:65px}.checks label{color:var(--text);padding:7px;border-bottom:1px solid #8883}.checks input{width:auto;margin-right:8px}button{cursor:pointer;background:var(--accent);border:0;color:white;font-weight:600}.secondary{background:#67727d}.danger{background:var(--bad)}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{width:auto}.status{font-size:18px;font-weight:700}.muted{color:var(--muted)}pre{white-space:pre-wrap;max-height:320px;overflow:auto;background:#0001;padding:10px;border-radius:7px}.event{padding:8px 0;border-bottom:1px solid #8883}.ok{color:var(--good)}.bad{color:var(--bad)}
</style></head><body><div class="wrap">
<div class="hero"><div><h1>⚡ Mains Power Alert</h1><div class="muted" id="version">Loading…</div></div><div class="status" id="powerStatus">UNKNOWN</div></div>
<div class="card"><h2>1. Select the mains source</h2><div class="grid"><div><label>Entity</label><select id="entity"></select></div><div><label>Attribute (leave empty to use state)</label><input id="attribute" placeholder="e.g. voltage"></div><div><label>Detection method</label><select id="mode"><option value="numeric">Numeric value / voltage</option><option value="state">Text state</option></select></div><div><label>Live value</label><input id="live" readonly></div></div><details><summary>Live entity attributes</summary><pre id="attributes">{}</pre></details></div>
<div class="card"><h2>2. Detection rules</h2><div class="grid numeric"><div><label>Power OFF below</label><input id="off_threshold" type="number"></div><div><label>Power ON above</label><input id="on_threshold" type="number"></div></div><div class="grid state"><div><label>OFF states (comma separated)</label><input id="off_values" value="off, unavailable, unknown"></div><div><label>ON states (comma separated)</label><input id="on_values" value="on"></div></div><div class="grid"><div><label>Outage confirmation delay (seconds)</label><input id="off_delay" type="number" min="0"></div><div><label>Restoration confirmation delay (seconds)</label><input id="on_delay" type="number" min="0"></div><div><label>Suppress alerts after add-on starts (seconds)</label><input id="startup_suppression" type="number" min="0"></div></div></div>
<div class="card"><h2>3. Choose phones</h2><div class="checks" id="services">No mobile_app services discovered yet.</div></div>
<div class="card"><h2>4. Alert wording</h2><div class="grid"><div><label>Outage title</label><input id="outage_title"><label>Outage message</label><textarea id="outage_message"></textarea></div><div><label>Restored title</label><input id="restore_title"><label>Restored message</label><textarea id="restore_message"></textarea></div></div></div>
<div class="card"><div class="actions"><button id="save">Save configuration</button><button class="secondary" id="testOff">Test outage alert</button><button class="secondary" id="testOn">Test restored alert</button><button class="secondary" id="copy">Copy diagnostics</button></div><p><label><input id="enabled" type="checkbox" style="width:auto"> Monitoring enabled</label></p><div id="message" class="muted"></div></div>
<div class="card"><h2>Recent events</h2><div id="events" class="muted">No events yet.</div></div>
</div><script>
const $=id=>document.getElementById(id), api=p=>fetch(p,{headers:{'Content-Type':'application/json'}});let cfg={},discovery={};
function selectedServices(){return [...document.querySelectorAll('#services input:checked')].map(x=>x.value)}
function modeView(){document.querySelector('.numeric').style.display=$('mode').value==='numeric'?'grid':'none';document.querySelector('.state').style.display=$('mode').value==='state'?'grid':'none'}
function values(){return{enabled:$('enabled').checked,entity_id:$('entity').value,attribute:$('attribute').value.trim(),mode:$('mode').value,off_threshold:+$('off_threshold').value,on_threshold:+$('on_threshold').value,off_delay:+$('off_delay').value,on_delay:+$('on_delay').value,startup_suppression:+$('startup_suppression').value,off_values:$('off_values').value.split(',').map(x=>x.trim()).filter(Boolean),on_values:$('on_values').value.split(',').map(x=>x.trim()).filter(Boolean),notify_services:selectedServices(),outage_title:$('outage_title').value,outage_message:$('outage_message').value,restore_title:$('restore_title').value,restore_message:$('restore_message').value}}
function fill(c){cfg=c;for(const k of ['attribute','mode','off_threshold','on_threshold','off_delay','on_delay','startup_suppression','outage_title','outage_message','restore_title','restore_message'])if($(k))$(k).value=c[k]??'';$('enabled').checked=!!c.enabled;$('off_values').value=(c.off_values||['off','unavailable','unknown']).join(', ');$('on_values').value=(c.on_values||['on']).join(', ');modeView()}
async function init(){const [cr,dr]=await Promise.all([api('api/settings'),api('api/discover')]);cfg=await cr.json();discovery=await dr.json();const options=(discovery.entities||[]).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<option value="${e.entity_id}">${e.name} — ${e.entity_id} (${e.state}${e.unit?' '+e.unit:''})</option>`).join('');$('entity').innerHTML='<option value="">Choose an entity…</option>'+options;$('entity').value=cfg.entity_id||'';$('services').innerHTML=(discovery.notify_services||[]).map(s=>`<label><input type="checkbox" value="${s}" ${(cfg.notify_services||[]).includes(s)?'checked':''}>${s}</label>`).join('')||'No mobile_app notification services found.';fill(cfg);await refresh()}
async function refresh(){try{const s=await(await api('api/status')).json();$('version').textContent=`Version ${s.version} · checked ${s.latest.checked_at||'not yet'}`;$('powerStatus').textContent=(s.detector_status||'unknown').toUpperCase();$('powerStatus').className='status '+(s.detector_status==='on'?'ok':s.detector_status==='off'?'bad':'');$('live').value=s.latest.value??'';$('attributes').textContent=JSON.stringify(s.latest.attributes||{},null,2)+(s.latest.error?'\nERROR: '+s.latest.error:'');$('events').innerHTML=s.events.length?s.events.map(e=>`<div class="event"><b>${e.kind.toUpperCase()}</b> · ${e.time}<br>${e.message}</div>`).join(''):'No events yet.'}catch(e){$('message').textContent=e}}
$('mode').onchange=modeView;$('save').onclick=async()=>{const r=await api('api/settings');await fetch('api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(values())});$('message').textContent='Saved. Detector baseline has been reset.';await refresh()};
async function test(kind){const r=await fetch(`api/test/${kind}`,{method:'POST'}),d=await r.json();$('message').textContent=d.outcomes?.every(x=>x.ok)?'Test sent successfully.':'One or more test notifications failed. Copy diagnostics for details.';await refresh()}
$('testOff').onclick=()=>test('off');$('testOn').onclick=()=>test('on');$('copy').onclick=async()=>{const t=await(await api('api/diagnostics')).text();await navigator.clipboard.writeText(t);$('message').textContent='Diagnostics copied to clipboard.'};setInterval(refresh,5000);init();
</script></body></html>
